name: CI

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run app scenarios
        run: |
          bash Tests/Performance/run.sh "$RUNNER_TEMP/muzika-scenarios.json" 1
          jq -e 'length > 0 and ([.[].action] | unique | length) == length' "$RUNNER_TEMP/muzika-scenarios.json"
