name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muzika-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate release version
        id: release
        run: |
          version=$(jq -er '.version | select(type == "string" and test("^v[1-9][0-9]*$"))' .github/release.json)
          jq -e '(.draft | type == "boolean") and (.prerelease | type == "boolean") and (.notes | type == "string" and length > 0)' .github/release.json
          number=${version#v}
          test "$(plutil -extract CFBundleVersion raw Info.plist)" = "$number"
          test "$(plutil -extract CFBundleShortVersionString raw Info.plist)" = "$number.0.0"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Run app scenarios
        run: |
          bash Tests/Performance/run.sh "$RUNNER_TEMP/muzika-scenarios.json" 1
          jq -e 'length > 0 and ([.[].action] | unique | length) == length' "$RUNNER_TEMP/muzika-scenarios.json"
      - name: Build Release
        run: |
          xcodebuild -project muzika.xcodeproj -scheme muzika -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath "$RUNNER_TEMP/muzika-build" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO COMPILER_INDEX_STORE_ENABLE=NO build -quiet
      - name: Package and verify
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          app="$RUNNER_TEMP/muzika-build/Build/Products/Release/MUZIKA?.app"
          archive="$RUNNER_TEMP/muzika-$VERSION-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          unzip -tq "$archive"
          unpacked=$(mktemp -d)
          ditto -x -k "$archive" "$unpacked"
          app="$unpacked/MUZIKA?.app"
          codesign --verify --strict --deep "$app"
          cmp LICENSE "$app/Contents/Resources/LICENSE"
          test "$(lipo -archs "$app/Contents/MacOS/MUZIKA?")" = arm64
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "${VERSION#v}.0.0"
          test "$(plutil -extract CFBundleVersion raw "$app/Contents/Info.plist")" = "${VERSION#v}"
          codesign -d --entitlements :- "$app" > "$unpacked/entitlements.plist" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$unpacked/entitlements.plist")" = true
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.security.get-task-allow' "$unpacked/entitlements.plist" 2>/dev/null | grep -qx true; then exit 1; fi
      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: muzika-${{ steps.release.outputs.version }}-macos-arm64
          path: ${{ runner.temp }}/muzika-${{ steps.release.outputs.version }}-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: muzika-${{ needs.build.outputs.version }}-macos-arm64
      - name: Create draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/muzika-release-notes.md"
          jq -er '.notes' .github/release.json > "$notes"
          flags=()
          if [ "$(jq -er '.prerelease | tostring' .github/release.json)" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$VERSION" "muzika-$VERSION-macos-arm64.zip" \
            --target "$GITHUB_SHA" --title "$VERSION" --draft --notes-file "$notes" "${flags[@]}"
          if [ "$(jq -er '.draft | tostring' .github/release.json)" = false ]; then
            gh release edit "$VERSION" --draft=false
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq '.object.sha')" = "$GITHUB_SHA"
          fi
